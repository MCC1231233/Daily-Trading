name: Daily Screening

on:
  schedule:
    # 03:00 KST (= 18:00 UTC 전날) 월~금. UTC 기준 일~목이 KST 기준 월~금.
    #
    # ■ 왜 07:40 이 아니라 03:00 인가 — 실측 때문이다.
    # 원래 07:40(장 시작 80분 전)이었고 "예약은 10~30분 밀린다"고 적어뒀었다.
    # 2026-09-08 에 generated_at 을 15일치 세어보니 그 전제가 깨져 있었다.
    #   08-19 +15분 / 08-21 +18분 / 08-24 +13분  (여기까지는 전제대로)
    #   08-31 +128분 / 09-01 +162분 / 09-02 +109분 / 09-03 +114분
    #   09-04  +99분 / 09-07  +98분
    # 08-31 이후 예약 실행 6/6 일이 09:00 이후에 끝났다 — 즉 장이 열린 뒤에
    # 리포트가 나왔다. 자동 주문(08:50 진입)은 이 상태로는 매일 실패한다.
    #
    # 파이프라인은 전일 종가만 쓰므로 전날 밤에 돌려도 결과가 같다. 03:00 으로
    # 당기면 관측된 최대 지연(162분)이 그대로 나도 05:45 에는 끝나 08:50 까지
    # 3시간 여유가 남는다. 그래도 못 미더우면 매매 서버가
    # `trade.py prepare` 로 직접 만든다 (TRADING.md 참조).
    - cron: "0 18 * * 0-4"
  workflow_dispatch:        # 수동 실행 (규칙 조정 후 즉시 확인용)

permissions:
  contents: write           # docs/data 커밋
  pages: write              # GitHub Pages 배포
  id-token: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 스크리닝 실행
        id: run
        run: |
          # 네이버/FDR 호출이 일시적으로 막히는 경우가 있어 3회까지 재시도한다.
          # 지표가 하나만 빠져도 그날 리포트 전체가 비므로 재시도할 값어치가 있다.
          for attempt in 1 2 3; do
            echo "::group::시도 $attempt"
            if python scripts/screen.py; then
              echo "::endgroup::"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
            echo "시도 $attempt 실패 — 60초 후 재시도"
            sleep 60
          done
          echo "3회 모두 실패"
          exit 1

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이거나 이미 발행됨)"
            exit 0
          fi
          git commit -m "데일리 스크리닝 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 동시 실행이나 수동 커밋과 겹칠 수 있어 rebase 후 푸시
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 비공개 저장소라 Pages를 못 쓰는 경우를 대비한 대안 경로.
      # 데이터를 전부 인라인한 파일 하나라 Actions에서 받아 바로 열 수 있다.
      - name: 단일 파일 빌드
        run: python scripts/build_standalone.py build/daily-trading.html

      - uses: actions/upload-artifact@v4
        with:
          name: daily-trading-html
          path: build/daily-trading.html
          retention-days: 90

  # 사전 조건: 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번
  # 설정해 두어야 한다. configure-pages의 enablement 옵션으로 자동화할 수는
  # 없다 — Pages 생성 API는 administration:write를 요구하는데 GITHUB_TOKEN은
  # 그 스코프를 가질 수 없어 "Resource not accessible by integration"으로 막힌다.
  deploy:
    needs: screen
    runs-on: ubuntu-latest
    # Pages 설정이 빠졌거나 플랜 제약이 있어도 스크리닝 결과 커밋은 이미
    # 끝난 상태이므로, 배포 실패로 전체 실행을 빨갛게 만들지 않는다.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
