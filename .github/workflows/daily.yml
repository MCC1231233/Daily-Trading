name: Daily Screening

on:
  schedule:
    # 08:20 KST (= 23:20 UTC 전날) 월~금.
    # UTC 기준 일~목이 KST 기준 월~금이 된다. 장 시작 40분 전.
    - cron: "20 23 * * 0-4"
  workflow_dispatch:        # 수동 실행 (규칙 조정 후 즉시 확인용)

permissions:
  contents: write           # docs/data 커밋
  pages: write              # GitHub Pages 배포
  id-token: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 스크리닝 실행
        id: run
        run: |
          # 네이버/FDR 호출이 일시적으로 막히는 경우가 있어 3회까지 재시도한다.
          # 지표가 하나만 빠져도 그날 리포트 전체가 비므로 재시도할 값어치가 있다.
          for attempt in 1 2 3; do
            echo "::group::시도 $attempt"
            if python scripts/screen.py; then
              echo "::endgroup::"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
            echo "시도 $attempt 실패 — 60초 후 재시도"
            sleep 60
          done
          echo "3회 모두 실패"
          exit 1

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이거나 이미 발행됨)"
            exit 0
          fi
          git commit -m "데일리 스크리닝 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 동시 실행이나 수동 커밋과 겹칠 수 있어 rebase 후 푸시
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true    # Pages가 꺼져 있으면 켜고 진행
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
