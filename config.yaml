# 스크리닝 규칙 설정
#
# 여기 있는 숫자가 곧 전략이다. 코드를 고치지 않고 이 파일만 바꿔서
# 룰을 조정할 수 있다. 값을 바꾸면 다음 실행부터 바로 반영된다.

universe:
  # 하드 필터 — 하나라도 걸리면 점수 계산 없이 탈락시킨다.
  min_amount_krw: 10_000_000_000      # 전일 거래대금 100억. 일중 진입/청산 슬리피지 방어선
  min_marcap_krw: 300_000_000_000     # 시총 3,000억. 그 아래는 수급 한 방에 휘둘린다
  min_price: 2_000                    # 동전주 제외 (호가 단위 대비 스프레드 부담)
  max_prev_change_pct: 15.0           # 전일 급등주 제외 — 다음날 갭 리스크가 비대칭
  min_prev_change_pct: -15.0          # 전일 급락주 제외 — 하락 사유가 당일에도 유효할 확률

  # 변동성 필터는 절대값이 아니라 그날 후보 풀 안에서의 상대 위치로 건다.
  # 시장 전체 변동성은 국면에 따라 몇 배씩 달라져서, 고정 구간을 쓰면
  # 조용한 장에서는 아무것도 안 걸리고 험한 장에서는 전부 탈락한다.
  atr_pct_band: [10, 85]              # 풀 내 ATR 하위 10% 미만 / 상위 15% 초과 제외
  atr_hard_min: 1.0                   # 그래도 이 아래면 수익 여지 자체가 없다
  atr_hard_max: 25.0                  # 이 위는 국면과 무관하게 일중 매매 대상이 아니다
  max_rsi: 78.0                       # 과매수 구간 신규 진입 배제
  exclude_dept_keywords:              # 관리종목/거래 제한 종목
    - 관리
    - 투자주의
    - 투자경고
    - 정리매매
  candidate_pool: 150                 # 거래대금 상위 N개만 상세 데이터를 받는다 (API 호출 절약)
  picks: 10

# 팩터 블록 가중치. 시장 국면에 따라 다르게 적용한다.
# 합이 1이 되도록 유지할 것.
weights:
  risk_on:      # 코스피·코스닥 모두 20일선 위 — 추세 추종이 먹히는 국면
    flow: 0.28
    momentum: 0.26
    intraday: 0.22
    technical: 0.14
    quality: 0.10
  neutral:      # 엇갈림 — 균형
    flow: 0.30
    momentum: 0.20
    intraday: 0.24
    technical: 0.14
    quality: 0.12
  risk_off:     # 둘 다 20일선 아래 — 모멘텀 비중을 줄이고 수급·펀더멘털로 방어
    flow: 0.32
    momentum: 0.10
    intraday: 0.24
    technical: 0.14
    quality: 0.20

technical:
  rsi_sweet_spot: 57.0   # 이 값에서 멀수록 감점. 과매도 반등도 과매수 추격도 피한다
  bb_sweet_spot: 0.62    # 밴드 상단 부근이되 돌파 직후는 아닌 위치
  volume_surge_cap: 4.0  # 거래량 급증은 좋지만 4배 넘으면 이미 이벤트가 끝난 경우가 많다

risk:
  max_per_sector: 4      # 한 업종에 4종목 초과 배정 금지 (분산)
  warn_if_regime_risk_off: true
