# 스크리닝 규칙 설정
#
# 발행 전략(primary) = 과매도 단일팩터.
# 2026-08-20 전환. 그림자 모드 14거래일 채점 결과 과매도 단일팩터가 누적 +28.14%,
# 유니버스 대비 일평균 초과 +1.046%로 역추세(+13.99%, +0.185%)를 앞섰다.
# 다만 t=0.88로 아직 유의하지 않다 — 20거래일이 쌓이기 전에는 판정하지 않는다.
# 역추세 규칙은 그대로 두고 대조군(shadow)으로 계속 채점한다.
#
# 전략: 낙폭이 과다한 저평가 우량주를 09:00 시가에 매수해 15:00 종가에 매도한다.
# 추세 추종이 아니라 역추세(평균회귀) 전략이므로, 많이 오른 종목이 아니라
# 많이 빠진 종목이 상위에 오도록 팩터 부호가 설계되어 있다.
#
# 이 전략의 최대 위험은 falling knife — 하락에 실제 이유가 있어서
# 다음 날도 계속 빠지는 경우다. 아래 quality_gates가 그 방어선이다.
# 여기 있는 숫자가 곧 전략이고, 코드 수정 없이 이 파일만 바꾸면 반영된다.

# [금지] min_marcap_krw / min_amount_krw / candidate_pool 세 값은 퀄리티
# 게이트 도입 이후 완화하지 않는다. 현행 사전필터는 이미 시총 상위 6%만 본다
# (후보풀 시총 중앙 30,226억 = 유니버스 94.1분위). 재무 게이트가 안전해 보이는
# 유일한 이유가 이것이다. 완화하면 즉시 편향이 커진다 — 시총게이트 제거 시
# 통과군 시총 중앙 +46.8%(rb +0.230), 전면완화 시 +75.3%(rb +0.254).
# 게이트가 풀을 절반으로 자르므로 완화 압력이 반드시 생긴다. 버텨라.
# 후보가 모자라면 완화하지 말고 pool_health를 'poor'로 띄우고 적게 발행한다.
universe:
  # --- 유동성·규모 게이트 ---
  # 거래대금 50억. 100억으로 두면 퀄리티 게이트를 통과한 종목이 20개 아래로
  # 떨어져 "20개 중 10개"를 뽑는 꼴이 된다. 선별력을 확보하려면 모집단이
  # 필요해서 낮췄다. 다만 유동성이 낮을수록 슬리피지가 일중 수익을 갉아먹으므로
  # 이 값을 더 내리는 것은 권하지 않는다.
  min_amount_krw: 5_000_000_000
  min_marcap_krw: 300_000_000_000     # 시총 3,000억. 그 아래는 수급 한 방에 휘둘린다
  min_price: 2_000                    # 동전주 제외 (호가 단위 대비 스프레드 부담)
  candidate_pool: 400                 # 거래대금 상위 N개만 상세 데이터를 받는다

  # --- 낙폭 조건: 이 전략의 대상을 정의한다 ---
  # 20일 수익률이 이 값보다 높으면 '낙폭 과다'가 아니므로 대상이 아니다.
  max_ret_20d: 3.0
  # 반대로 이 아래는 단순 조정이 아니라 구조적 문제일 확률이 높다.
  min_ret_20d: -45.0
  # 52주 고점 대비 최소 이만큼은 빠져 있어야 '낙폭 과다'라 부를 수 있다.
  # -8%로 두면 고점 근처에서 살짝 눌린 종목까지 들어와 전략 성격이 흐려진다.
  max_drawdown_52w: -20.0
  # 전일 급락은 다음 날 갭 리스크가 비대칭이라 하루 쉬어간다.
  min_prev_change_pct: -12.0
  max_prev_change_pct: 8.0

  # --- 과매도 구간 ---
  # 이 전략은 낮은 RSI를 원한다. 다만 15 미만은 되돌림이 아니라
  # 추세적 붕괴인 경우가 많아 하한도 함께 둔다.
  rsi_range: [15.0, 58.0]

  # --- 변동성 ---
  # 절대값이 아니라 그날 후보 풀 안에서의 상대 위치로 건다. 시장 전체
  # 변동성이 국면에 따라 몇 배씩 달라져 고정 구간은 금방 무용지물이 된다.
  atr_pct_band: [10, 85]
  atr_hard_min: 1.0
  atr_hard_max: 25.0
  # 앞선 게이트 통과 종목이 이보다 적으면 상대 밴드를 적용하지 않는다.
  # 표본이 작을 때 양 끝을 자르면 유효 후보를 위험도와 무관하게 잃는다.
  atr_band_min_pool: 40

  exclude_dept_keywords:
    - 관리
    - 투자주의
    - 투자경고
    - 정리매매

  picks: 10

# --- 과매도 단일팩터 (발행 전략) ---
#
# 점수는 RSI(14) 하나로만 매긴다. 팩터를 더하지 않는 것이 이 전략의 정의다.
# 아래는 전부 '점수'가 아니라 '탈락 조건'이며, 유니버스 공통 유동성 게이트에
# 두 가지만 얹는다.
oversold:
  # RSI 하한. 이 아래는 되돌림이 아니라 추세적 붕괴인 경우가 많다.
  # 12년 패널에서 모멘텀 십분위가 역U자였다(양 극단이 중간보다 나쁨).
  rsi_floor: 10.0

  # 변동성 최상위 분위 배제.
  #
  # 12년·2,800종목·생존편향 제거 패널에서 적대적 검증 3개 렌즈(표본외·다중비교·
  # 실행비용)를 모두 통과한 **유일한** 양성 규칙이다. 유니버스 동일가중 대비
  # 연 +3.60%p (Newey-West t=4.76), 20~30종목 계좌에서도 증분 +3.79%p(t=4.81,
  # 승률 90%). 단 이것은 수익을 늘리는 규칙이 아니라 재앙을 피하는 규칙이다.
  #
  # 주의: '저변동을 사라'는 근거가 없다. 분위가 단조가 아니라 정보가 최상위
  # 한 방향에만 있다. 그래서 점수에 넣지 않고 배제 게이트로만 쓴다.
  exclude_top_vol_pct: 20
  # 통과 종목이 이보다 적으면 배제를 적용하지 않는다. 표본이 작을 때
  # 상위 20%를 자르면 위험도와 무관하게 유효 후보를 잃는다.
  vol_screen_min_pool: 40

# --- 1단계 기업 선별 게이트 (quality_oversold 변형 전용) -----------------
#
# 전략 정의: "장기 성장 포텐셜이 크고 매출·이익이 개선되는 우량 기업이,
# 단지 전날 과매도 구간에 들어갔을 때 매수한다."
#   1단계(여기) = 기업 선별. 분기마다 바뀐다.
#   2단계       = RSI(14) 타이밍. 매일 바뀐다.
#
# 아래는 전부 '탈락 조건'이며 점수에는 일절 들어가지 않는다. 점수는 oversold와
# 똑같이 RSI(14) 하나다. 그래야 두 변형의 차이가 정확히 '펀더멘털' 하나로
# 귀속된다. 점수에 섞으면 안 되는 이유는 실측으로 확인됐다 — 가중치 15%면
# 순수 RSI 순위와 스피어만 0.988·상위10 겹침 10/10(장식), 50%면 겹침 5/10에
# 평균 RSI 31.4→38.9로 전략 성격 자체가 바뀐다.
#
# ■ 이 게이트는 검증되지 않았다.
# 네이버 재무 API는 현재 시점 스냅샷만 주므로 point-in-time 재구성이 불가능하고,
# 따라서 수익 효과를 백테스트로 만들 수 없다. 12년 생존편향제거 패널에서
# '가격기반 퀄리티 프록시'로 대용 검정한 결과 10종목 바스켓 증분은
# -2.16bp/일(NW t=-1.39, 95% CI [-5.27, +0.90])로 0과 구별되지 않았고,
# 그중 79%가 선정 평균 RSI 상승(30.2->32.6)에 따른 기계적 희석으로 설명됐다.
# 확인된 유일한 이득은 좌측꼬리 축소다 — 5%VaR -2.43%->-2.12%,
# 1%VaR -4.15%->-3.61%, -3% 이하 손실일 3.18%->2.00%.
# 단 총수익/표준편차 비는 0.032->0.022로 오히려 악화한다.
# 즉 알파 장치가 아니라 '이 회사는 사고 싶지 않다'는 선호를 규칙으로 적은
# 것이고, 대가는 변동성 축소이지 수익 개선이 아니다.
quality_growth:

  # 보고 ROE 하한 (%). 사용자 정의의 '수익성' 축.
  #
  # 주의 1 — factors 의 기존 roe(=EPS/BPS)와 다른 값이다. 296종목 실측 중앙
  #   괴리 1.83%p, p90 11.06%p, 10종목은 부호까지 다르다(SK하이닉스 보고
  #   44.1% vs EPS/BPS 96.7%). 기존 roe 컬럼은 reversal 변형이 게이트로 쓰므로
  #   절대 덮어쓰지 않는다.
  # 주의 2 — 분기표의 TTM ROE를 우선 쓴다. 연간표 최신 실적은 8개월 묵었고,
  #   어느 쪽을 쓰느냐가 ROE>=5 판정을 217중 23종목(11%)에서 뒤집는다
  #   (S-Oil 2.01->10.35, 펄어비스 -1.05->16.85).
  # 주의 3 — 튜닝하지 마라. 컷을 3~8 어디에 두든 상위10은 매 단계 0~2종목만
  #   바뀐다. 이 숫자에 실린 정보는 1비트 미만이다. 8 이상으로 올리면 오늘
  #   통과가 74종목으로 떨어지고 12년 시뮬에서 풀<80인 날이 46%가 된다 —
  #   되돌린 역추세와 같은 경로다.
  min_roe_reported: 5.0

  # 매출 CAGR 하한 (%). 사용자 정의의 '장기 성장 포텐셜' 축.
  #
  # ■ 0보다 크게 올리는 것을 금지한다.
  #   12년 패널에서 '3년 가격상승' 성장 프록시는 유의하게 해로웠다
  #   (FM -0.0649%p/z t=-5.49, N=10 -6.60bp t=-3.49, 최근 12개월 제외 정의로도
  #   -2.83bp, 5년 정의 -5.62bp t=-2.53). 게다가 그 프록시는 잔차변동성과
  #   rho=+0.20~+0.39 — 성장 필터는 적대적 검증을 통과한 유일한 규칙
  #   (oversold.exclude_top_vol_pct: 20)이 배제하려는 방향으로 픽을 민다.
  #   그 프록시가 매출 CAGR과 같은 변수라는 보장이 없으므로 축을 버리지는 않되
  #   "역성장은 아닐 것"이라는 최약 형태로만 남긴다.
  #
  # CAGR 지수는 2다(실적 연도가 항상 3개뿐). 화면에 '3년'이라고 적지 마라.
  # YoY 대신 CAGR을 쓰는 이유는 기저효과다 — 실측 영업이익 YoY 분포가
  # p10 -49.5% / p90 +188.9%로 사실상 노이즈다.
  min_rev_cagr: 0.0

  # 재무 수집률이 이보다 낮으면 펀더멘털 게이트를 통째로 건너뛴다.
  # 네이버 장애로 재무가 안 오는 날 3종목짜리 리스트를 발행하지 않기 위한
  # 안전장치다. 평시 수집률 100%이므로 발동할 일이 없어야 정상이다.
  min_data_coverage: 0.80

  # 통과 종목이 이보다 적으면 pool_health를 'poor'로 표시한다.
  # 자동 완화(임계 낮추기)는 하지 않는다 — 국면에 따라 규칙이 몰래 바뀌면
  # 그림자 모드의 귀속성이 사라진다. 후보가 모자라면 적게 발행한다.
  min_pool_warn: 80

  # ■ 채택하지 않은 축 (되살리지 마라)
  # (1) 컨센서스 영업이익/EPS 성장 — 컨센 보유 여부가 시총 그 자체다.
  #     시총 Q1 보유율 0.8% vs Q5 65.8%, 보유/결측군 시총 중앙 6,583억 vs
  #     731억 (rank-biserial +0.771, p=4.8e-169). 결측탈락 시 등가 하위배제율
  #     16.7%로 선행연구가 반증한 '하위 20% 배제'(-4.98%p, t=-6.41)와 동급.
  #     결측통과 시엔 230중 7종목만 제거하는 죽은 축. 게다가 표적인 이마트는
  #     컨센 영업이익 +29.9%라 못 잡고, 한국전력(ROE 19.4%)은 잡아버린다.
  #     수집·표시만 하고 게이트로 쓰지 않는다.
  # (2) 컨센서스 '매출액' — 232종목 중 20종목(8.6%)이 +100% 초과. 증권사
  #     영업수익 총액/순액 정의 불일치(NH +163%, 키움 +126%). 수집조차 안 한다.
  # (3) 부채비율 상한 — 200% 컷은 금융계열 20종목을 전부 배제한다
  #     (금융 부채비율 중앙 1,029% vs 비금융 79%). 업종 배제로 작동한다.
  # (4) 최근 3년 영업흑자 연수 — 한계기여 0종목. ROE 게이트가 전부 흡수한다.
  # (5) 영업이익률·순이익률·매출YoY·영업이익YoY — 기존 2축과 Jaccard
  #     0.76~0.79로 중복. 6지표는 사실상 2~3축이다.


# falling knife 방어. "좋은 종목"의 조작적 정의이며, 하나라도 어기면 탈락한다.
quality_gates:
  require_profitable: true      # EPS > 0. 적자 기업의 낙폭은 반등 근거가 약하다
  # require_coverage 삭제 — 목표주가 커버리지가 시총 Q1 0.4% -> Q5 69.2%.
  #   퀄리티가 아니라 규모 필터다.
  min_roe: 2.0                  # 자기자본 대비 최소 수익성 (%)
  max_pbr: 5.0                  # '저평가' 전략인데 고PBR을 담을 이유가 없다
  # min_target_upside 삭제 — 217종목 중 187개(86.2%)를 통과시켜 무변별.

  # 전일 하락한 다음 날의 시가→종가 수익률 하한 (%).
  #
  # 이 전략의 매매 조건과 정확히 같은 상황에서의 과거 성적이라, 가중 합산에
  # 섞어두면 다른 블록 점수에 묻힌다. 실제로 게이트 없이 돌렸을 때 상위
  # 10종목 중 5개가 이 값이 마이너스였다. 낙폭도 크고 싸고 수급도 좋지만
  # 정작 하락 다음 날 반등하지 않고 더 빠져온 종목들이다.
  #
  # 0으로 두면 "과거에 이 상황에서 최소한 손해는 안 봤다"를 요구하는 것.
  # null로 두면 이 게이트를 끄고 점수에만 반영한다.
  min_oc_after_down: 0.0
  # 위 조건을 적용하려면 최소 이만큼의 표본이 있어야 한다. 표본이 모자란
  # 종목은 판단 불가로 보고 통과시킨다(점수에서는 중립 처리됨).
  min_oc_after_down_samples: 10

# 팩터 블록 가중치. 시장 국면에 따라 다르게 적용한다. 합은 1.
#
# 국면 판단의 방향이 추세 전략과 반대라는 점에 주의. 지수가 20일선 아래인
# 위험회피 국면에서는 과매도가 더 과매도로 가기 쉬워 평균회귀가 잘 안 듣는다.
# 그래서 낙폭 비중을 줄이고 퀄리티·수급으로 방어한다.
weights:
  risk_on:      # 지수는 건강한데 개별 종목만 조정 — 반등 확률이 가장 높은 국면
    drawdown: 0.30
    reversal: 0.24
    flow: 0.20
    value: 0.16
    quality: 0.10
  neutral:
    drawdown: 0.24
    reversal: 0.24
    flow: 0.22
    value: 0.18
    quality: 0.12
  risk_off:     # 지수도 무너진 국면 — 낙폭만 보고 들어가면 계속 물린다
    drawdown: 0.14
    reversal: 0.22
    flow: 0.28
    value: 0.16
    quality: 0.20

scoring:
  rsi_sweet_spot: 32.0     # 과매도이되 붕괴는 아닌 지점
  bb_sweet_spot: 0.15      # 볼린저 하단 부근
  drawdown_sweet_spot: -25.0   # 52주 고점 대비 이 근처를 최적으로 보고 멀수록 감점
  capitulation_cap: 5.0    # 항복 거래량은 좋지만 5배 넘으면 악재 뉴스일 확률이 높다
  min_down_day_samples: 5  # oc_after_down을 신뢰하려면 최소 이만큼의 표본이 필요

risk:
  max_per_sector: 3        # 낙폭은 업종 단위로 동시에 발생해 쏠림이 심하다
